<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>DoctorAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --bg: #f5f1ea;
  --surface: #ffffff;
  --ink: #1a1a1a;
  --ink-soft: #5a5a5a;
  --ink-faint: #9a9a9a;
  --rule: #e8e2d6;
  --rule-soft: #f0ebe0;
  --accent: #b84c2e;
  --accent-soft: #f3e4dc;
  --user-bubble: #ebe4d3;
  --doctor-bubble: #ffffff;
  --danger: #c2392a;
  --ok: #3d7a4f;
}

html, body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--ink);
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  font-size: 15px;
  line-height: 1.5;
}
body {
  display: flex; flex-direction: column;
  background-image: radial-gradient(ellipse 1200px 400px at 50% -10%, rgba(184,76,46,0.05), transparent 60%);
}

.header {
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--rule);
  background: rgba(245,241,234,0.85);
  backdrop-filter: blur(12px);
  flex-shrink: 0; z-index: 10;
}
.brand { display:flex; align-items:center; gap:10px; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.brand-mark::before, .brand-mark::after {
  content:''; position:absolute; background:white; border-radius:1px;
}
.brand-mark::before { width: 12px; height: 2px; }
.brand-mark::after { width: 2px; height: 12px; }
.brand-name {
  font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px;
  letter-spacing: -0.5px; color: var(--ink);
}
.brand-name em { font-style: italic; color: var(--accent); font-weight: 500; }

.status-pill {
  display:flex; align-items:center; gap:8px;
  padding: 6px 12px; border-radius: 100px;
  background: var(--surface); border: 1px solid var(--rule);
  font-size: 12px; color: var(--ink-soft); font-weight: 500;
}
.status-pill .dot { width:7px; height:7px; border-radius:50%; background: var(--ink-faint); }
.status-pill.active .dot { background: var(--ok); animation: pulse 2s infinite; }
.status-pill.ended .dot { background: var(--ink-faint); }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(61,122,79,0.45); }
  70%  { box-shadow: 0 0 0 8px rgba(61,122,79,0); }
  100% { box-shadow: 0 0 0 0 rgba(61,122,79,0); }
}
.timer { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 13px; font-weight: 500; }

.main {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  max-width: 720px; width: 100%; margin: 0 auto; padding: 0 20px;
}

.presence {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 4px 16px;
  border-bottom: 1px solid var(--rule-soft);
}
.avatar {
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-soft), #fff);
  border: 1px solid var(--rule);
  display:flex; align-items:center; justify-content:center;
  flex-shrink: 0; position: relative;
}
.avatar svg { width: 24px; height: 24px; color: var(--accent); }
.avatar.speaking::before {
  content:''; position:absolute; inset:-4px; border-radius: 50%;
  border: 2px solid var(--accent); opacity: 0.4;
  animation: ring 1.4s ease-out infinite;
}
@keyframes ring {
  0% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(1.25); opacity: 0; }
}
.presence-text { flex: 1; min-width: 0; }
.presence-name {
  font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px;
  color: var(--ink); letter-spacing: -0.3px;
}
.presence-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
.wave { display:flex; align-items:center; gap: 3px; height: 18px; }
.wave-bar {
  width: 2px; height: 3px; background: var(--accent); border-radius: 2px;
  opacity: 0.25; transition: opacity 0.2s;
}
.wave.on .wave-bar { opacity: 1; }
.wave.on .wave-bar:nth-child(1) { animation: wv 0.6s ease-in-out infinite; }
.wave.on .wave-bar:nth-child(2) { animation: wv 0.8s ease-in-out infinite 0.1s; }
.wave.on .wave-bar:nth-child(3) { animation: wv 0.5s ease-in-out infinite 0.2s; }
.wave.on .wave-bar:nth-child(4) { animation: wv 0.7s ease-in-out infinite 0.3s; }
.wave.on .wave-bar:nth-child(5) { animation: wv 0.6s ease-in-out infinite 0.15s; }
@keyframes wv { 0%,100% { height: 3px; } 50% { height: 16px; } }

.convo {
  flex: 1; overflow-y: auto; padding: 20px 4px 24px;
  display: flex; flex-direction: column; gap: 14px;
  scrollbar-width: thin; scrollbar-color: var(--rule) transparent;
  -webkit-overflow-scrolling: touch;
}
.convo::-webkit-scrollbar { width: 4px; }
.convo::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }

.msg {
  display: flex; flex-direction: column; gap: 4px;
  max-width: 82%; animation: rise 0.28s ease-out;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.doctor { align-self: flex-start; }

.msg-label {
  font-size: 11px; color: var(--ink-faint); font-weight: 500;
  letter-spacing: 0.3px; padding: 0 4px;
}
.bubble {
  padding: 11px 15px; border-radius: 16px;
  font-size: 15px; line-height: 1.5;
  /* Min-width so partial sentences don't look like wisps */
  min-height: 41px;
}
.msg.doctor .bubble {
  background: var(--doctor-bubble); border: 1px solid var(--rule);
  border-top-left-radius: 4px; color: var(--ink);
}
.msg.user .bubble {
  background: var(--user-bubble); border-top-right-radius: 4px; color: var(--ink);
}

/* Streaming cursor — appears after the last sentence while more is coming */
.bubble.streaming::after {
  content: ''; display: inline-block;
  width: 7px; height: 16px;
  background: var(--accent); margin-left: 3px;
  vertical-align: middle; border-radius: 1px;
  animation: cursor 0.9s steps(2) infinite;
}
@keyframes cursor { 50% { opacity: 0; } }

.thinking {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 13px 16px;
  background: var(--doctor-bubble); border: 1px solid var(--rule);
  border-radius: 16px; border-top-left-radius: 4px;
}
.thinking span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ink-faint); animation: think 1.2s ease-in-out infinite;
}
.thinking span:nth-child(2) { animation-delay: 0.15s; }
.thinking span:nth-child(3) { animation-delay: 0.3s; }
@keyframes think {
  0%,80%,100% { opacity: 0.3; transform: translateY(0); }
  40% { opacity: 1; transform: translateY(-3px); }
}

.empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  gap: 12px; padding: 40px 20px; color: var(--ink-soft);
}
.empty-title {
  font-family: 'Fraunces', serif; font-weight: 500; font-style: italic;
  font-size: 22px; color: var(--ink); letter-spacing: -0.3px;
}
.empty-sub { font-size: 13.5px; max-width: 300px; line-height: 1.6; }
.empty-arrow {
  margin-top: 10px; font-size: 20px; color: var(--accent);
  animation: bob 1.8s ease-in-out infinite;
}
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

.footer {
  border-top: 1px solid var(--rule);
  background: rgba(245,241,234,0.95);
  backdrop-filter: blur(12px);
  padding: 12px 20px 16px; flex-shrink: 0; z-index: 10;
}

.lang-row {
  max-width: 720px; margin: 0 auto 10px; position: relative;
}
.lang-row::after {
  content:''; position:absolute; right:0; top:0; bottom:0; width: 30px;
  background: linear-gradient(to right, transparent, var(--bg)); pointer-events: none;
}
.lang-scroll {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  padding-right: 24px; padding-bottom: 2px;
}
.lang-scroll::-webkit-scrollbar { display: none; }

.lang-chip {
  flex-shrink: 0; padding: 7px 14px; border-radius: 100px;
  border: 1px solid var(--rule); background: var(--surface);
  color: var(--ink-soft); font-family: 'Inter', sans-serif;
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all 0.15s; white-space: nowrap; min-height: 34px;
}
.lang-chip:hover { border-color: var(--ink-soft); color: var(--ink); }
.lang-chip.active { background: var(--ink); border-color: var(--ink); color: white; }

.controls {
  max-width: 720px; margin: 0 auto;
  display: flex; align-items: center; justify-content: center; gap: 14px;
}
.mic-btn {
  flex: 1; max-width: 420px; height: 56px; border-radius: 100px;
  border: none; background: var(--ink); color: white;
  font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer; transition: transform 0.12s, background 0.2s, opacity 0.2s;
  box-shadow: 0 4px 14px rgba(26,26,26,0.15);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  white-space: nowrap;
  overflow: hidden;
}
.mic-btn #micLabel {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.mic-btn:active:not(.disabled) { transform: scale(0.97); }
.mic-btn.disabled { opacity: 0.4; cursor: not-allowed; }
.mic-btn.recording {
  background: var(--danger); animation: recPulse 1.4s ease-in-out infinite;
  box-shadow:
    0 4px 14px rgba(194,57,42,0.3),
    0 0 0 calc(var(--mic-glow, 0) * 10px) rgba(194,57,42, calc(var(--mic-glow, 0) * 0.35));
}
@keyframes recPulse {
  0%,100% { box-shadow: 0 4px 14px rgba(194,57,42,0.3), 0 0 0 0 rgba(194,57,42,0.4); }
  60%     { box-shadow: 0 4px 14px rgba(194,57,42,0.2), 0 0 0 14px rgba(194,57,42,0); }
}

/* Thinking: smooth breathing pulse — no layout shift, no moving dots.
   The whole button gently fades between two grey tones. Label stays still. */
.mic-btn.thinking {
  background: #4a4a4a;
  cursor: default;
  animation: thinkingBreath 2.2s ease-in-out infinite;
}
.mic-btn.thinking svg { display: none; }
@keyframes thinkingBreath {
  0%,100% { background-color: #4a4a4a; box-shadow: 0 4px 14px rgba(74,74,74,0.25); }
  50%     { background-color: #6b6b6b; box-shadow: 0 4px 18px rgba(107,107,107,0.35); }
}
.mic-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

.end-btn {
  width: 56px; height: 56px; border-radius: 50%;
  border: 1px solid var(--rule); background: var(--surface);
  color: var(--ink-soft); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.12s, background 0.2s, border-color 0.2s, color 0.2s;
  flex-shrink: 0;
}
.end-btn:hover { border-color: var(--danger); color: var(--danger); }
.end-btn:active { transform: scale(0.94); }
.end-btn svg { width: 18px; height: 18px; }

.emergency-banner {
  background: var(--danger); color: white;
  padding: 10px 16px; font-size: 13px; font-weight: 500;
  text-align: center; animation: rise 0.3s ease; border-radius: 8px;
}

/* Pose images — shown below the doctor's bubble when a yoga pose is mentioned.
   Horizontal scrollable strip so multiple poses don't push the UI around. */
.pose-strip {
  display: flex; gap: 8px;
  margin-top: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
  max-width: 100%;
}
.pose-strip::-webkit-scrollbar { display: none; }

.pose-card {
  flex-shrink: 0;
  width: 120px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 12px;
  overflow: hidden;
  animation: rise 0.35s ease-out;
  transition: transform 0.15s, border-color 0.15s;
  cursor: zoom-in;
}
.pose-card:hover { border-color: var(--accent); }
.pose-card:active { transform: scale(0.97); }
.pose-card img {
  width: 100%;
  height: 90px;
  object-fit: cover;
  display: block;
  background: var(--rule-soft);
}
.pose-card .pose-name {
  padding: 6px 8px 7px;
  font-family: 'Fraunces', serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  text-align: center;
  line-height: 1.2;
  letter-spacing: -0.1px;
}

/* Tap-to-expand lightbox overlay */
.pose-lightbox {
  position: fixed; inset: 0;
  background: rgba(26,26,26,0.92);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  padding: 20px;
  animation: fadein 0.2s ease;
}
.pose-lightbox img { max-width: 100%; max-height: 80vh; border-radius: 12px; }
.pose-lightbox .pose-lightbox-name {
  position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
  color: white; font-family: 'Fraunces', serif; font-size: 18px;
  background: rgba(0,0,0,0.5); padding: 6px 16px; border-radius: 100px;
}
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: white;
  padding: 10px 18px; border-radius: 100px; font-size: 13px;
  z-index: 100; opacity: 0;
  transition: opacity 0.3s, transform 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

@media (max-width: 520px) {
  .main { padding: 0 14px; }
  .footer { padding: 10px 14px 14px; }
  .presence { padding: 14px 2px; }
  .bubble { font-size: 14.5px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"></div>
    <div class="brand-name">Doctor<em>AI</em></div>
  </div>
  <div class="status-pill" id="statusPill">
    <div class="dot"></div>
    <span id="statusText">Pick a language</span>
    <span class="timer" id="timer" style="display:none"></span>
  </div>
</header>

<main class="main">
  <div class="presence" id="presence" style="display:none">
    <div class="avatar" id="avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2v4M16 2v4M12 18v3M5 8v4a7 7 0 0 0 14 0V8"/>
        <circle cx="18" cy="15" r="2"/>
      </svg>
    </div>
    <div class="presence-text">
      <div class="presence-name">Dr. DoctorAI</div>
      <div class="presence-sub" id="presenceSub">General physician · Ayurveda + modern</div>
    </div>
    <div class="wave" id="wave">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
  </div>

  <div class="convo" id="convo">
    <div class="empty" id="empty">
      <div class="empty-title">Namaste. How can I help?</div>
      <div class="empty-sub">Choose your language below to start a voice consultation — blending Ayurveda, yoga, and modern medicine.</div>
      <div class="empty-arrow">↓</div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="lang-row"><div class="lang-scroll" id="langScroll"></div></div>
  <div class="controls">
    <button class="mic-btn disabled" id="micBtn" onclick="toggleRecording()">
      <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="11" rx="3" fill="currentColor" stroke="none"/>
        <path d="M5 11a7 7 0 0 0 14 0"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="8" y1="22" x2="16" y2="22"/>
      </svg>
      <span id="micLabel">Choose a language first</span>
    </button>
    <button class="end-btn" onclick="endCall()" title="End call" aria-label="End call">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" transform="rotate(135 12 12)"/>
      </svg>
    </button>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
const LANGUAGES = [
  {name:"हिन्दी",code:"hi-IN"},
  {name:"தமிழ்",code:"ta-IN"},
  {name:"తెలుగు",code:"te-IN"},
  {name:"मराठी",code:"mr-IN"},
  {name:"বাংলা",code:"bn-IN"},
  {name:"ಕನ್ನಡ",code:"kn-IN"},
  {name:"ગુજરાતી",code:"gu-IN"},
  {name:"മലയാളം",code:"ml-IN"},
  {name:"English",code:"en-IN"},
];

// State
let selectedLang = null;
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
let state = "idle"; // idle | recording | thinking | streaming
let timerInterval = null;
let silenceTimer = null, maxTimer = null;
let audioCtx = null, analyser = null;
let sessionToken = 0;
let activeAudioEls = [];
let audioPlaybackQueue = []; // {audio} items waiting to play
let isPlayingAudio = false;
let chatAbortController = null;

// DOM helpers
const $ = id => document.getElementById(id);
const statusPill = $("statusPill"), statusText = $("statusText"), timer = $("timer");
const convo = $("convo"), empty = $("empty");

// Pose image lightbox — tap any pose card to enlarge
convo.addEventListener("click", (e) => {
  const card = e.target.closest(".pose-card");
  if (!card) return;
  const img = card.querySelector("img");
  const name = card.querySelector(".pose-name")?.textContent || "";
  if (!img || !img.src) return;
  const box = document.createElement("div");
  box.className = "pose-lightbox";
  box.innerHTML = `<img src="${img.src}" alt="${name}"/><div class="pose-lightbox-name">${name}</div>`;
  box.onclick = () => box.remove();
  document.body.appendChild(box);
});
const micBtn = $("micBtn"), micLabel = $("micLabel"), micIcon = $("micIcon");
const presence = $("presence"), avatar = $("avatar"), wave = $("wave");
const toast = $("toast");

function setStatus(text, cls) {
  statusText.textContent = text;
  statusPill.className = "status-pill" + (cls ? " " + cls : "");
}
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2400);
}
function setMicState(s, label) {
  micBtn.className = "mic-btn" + (s === "disabled" ? " disabled" : s === "recording" ? " recording" : s === "thinking" ? " thinking" : "");
  micLabel.textContent = label;
  micIcon.innerHTML = s === "recording"
    ? '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>'
    : '<rect x="9" y="2" width="6" height="11" rx="3" fill="currentColor" stroke="none"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>';
}
function setDoctorSpeaking(on) {
  avatar.classList.toggle("speaking", on);
  wave.classList.toggle("on", on);
}

// Live mic feedback — shown while recording so user knows the mic is picking them up
function updateMicLevel(rms, isVoice) {
  if (!isRecording) return;
  // Label tells the user what's happening
  if (rms < 1) {
    micLabel.textContent = "Mic is quiet — speak up";
  } else if (isVoice) {
    micLabel.textContent = "Listening… tap to stop";
  } else {
    // Either calibrating or below threshold — keep them calm
    micLabel.textContent = "Go ahead… tap to stop";
  }
  // Glow scales with voice level — capped so it doesn't go wild
  const intensity = Math.min(1, rms / 30);
  micBtn.style.setProperty("--mic-glow", intensity.toFixed(2));
}
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  const start = Date.now();
  timer.style.display = "inline";
  timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - start) / 1000);
    const m = String(Math.floor(s / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    timer.textContent = ` · ${m}:${ss}`;
  }, 1000);
}
function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  timer.style.display = "none";
}
function clearEmpty() { if (empty && empty.parentNode) empty.remove(); }

function addMsg(role, text) {
  clearEmpty();
  const t = $("thinkingMsg"); if (t) t.remove();
  const msg = document.createElement("div");
  msg.className = `msg ${role}`;
  msg.innerHTML = `<div class="msg-label">${role === "doctor" ? "DoctorAI" : "You"}</div><div class="bubble"></div>`;
  msg.querySelector(".bubble").textContent = text;
  convo.appendChild(msg);
  convo.scrollTop = convo.scrollHeight;
  return msg;
}
function addThinking() {
  clearEmpty();
  const msg = document.createElement("div");
  msg.className = "msg doctor";
  msg.id = "thinkingMsg";
  msg.innerHTML = `<div class="msg-label">DoctorAI</div><div class="thinking"><span></span><span></span><span></span></div>`;
  convo.appendChild(msg);
  convo.scrollTop = convo.scrollHeight;
}
function addEmergencyBanner() {
  const b = document.createElement("div");
  b.className = "emergency-banner";
  b.textContent = "⚠ Emergency detected — please act now";
  convo.appendChild(b);
  convo.scrollTop = convo.scrollHeight;
}

// ─────────── Audio queue ───────────
// Sentences arrive out of order in time but we want in-order playback.
// Since backend emits in-order, we just play FIFO.
function enqueueAudio(b64) {
  if (!b64) return;
  audioPlaybackQueue.push(b64);
  if (!isPlayingAudio) playNextFromQueue();
}
async function playNextFromQueue() {
  if (audioPlaybackQueue.length === 0) {
    isPlayingAudio = false;
    setDoctorSpeaking(false);
    return;
  }
  isPlayingAudio = true;
  setDoctorSpeaking(true);
  const b64 = audioPlaybackQueue.shift();
  const audio = new Audio("data:audio/wav;base64," + b64);
  activeAudioEls.push(audio);
  await new Promise(resolve => {
    audio.onended = resolve;
    audio.onerror = resolve;
    audio.play().catch(resolve);
  });
  activeAudioEls = activeAudioEls.filter(a => a !== audio);
  playNextFromQueue();
}
function stopAllAudio() {
  audioPlaybackQueue = [];
  activeAudioEls.forEach(a => { try { a.pause(); a.src = ""; } catch(e){} });
  activeAudioEls = [];
  isPlayingAudio = false;
  setDoctorSpeaking(false);
}

// ─────────── Abort ───────────
function abortEverything() {
  sessionToken++;
  if (chatAbortController) { chatAbortController.abort(); chatAbortController = null; }
  stopAllAudio();
  if (isRecording) {
    isRecording = false;
    if (silenceTimer) clearInterval(silenceTimer);
    if (maxTimer) clearTimeout(maxTimer);
    silenceTimer = maxTimer = null;
    if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
    try { mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop()); } catch(e){}
  }
  state = "idle";
}

// ─────────── Language chips ───────────
LANGUAGES.forEach(lang => {
  const btn = document.createElement("button");
  btn.className = "lang-chip";
  btn.textContent = lang.name;
  btn.onclick = () => selectLanguage(lang, btn);
  $("langScroll").appendChild(btn);
});

async function selectLanguage(lang, btn) {
  abortEverything();
  const myToken = sessionToken;

  document.querySelectorAll(".lang-chip").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  selectedLang = lang;

  setMicState("disabled", "Connecting…");
  setStatus("Connecting…");
  presence.style.display = "flex";
  $("presenceSub").textContent = `General physician · Ayurveda + modern · ${lang.name}`;
  convo.innerHTML = "";
  addThinking();

  let data;
  try {
    const res = await fetch("/set_language", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ lang_code: lang.code }),
    });
    data = await res.json();
  } catch (e) {
    showToast("Connection failed");
    return;
  }
  if (myToken !== sessionToken) return;

  const t = $("thinkingMsg"); if (t) t.remove();
  addMsg("doctor", data.text);
  setStatus("Connected", "active");
  startTimer();
  setMicState("idle", "Tap to speak");
  (data.audios || []).forEach(enqueueAudio);
}

// ─────────── Recording ───────────
async function toggleRecording() {
  if (!selectedLang || state === "thinking") return;

  if (!isRecording) {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      showToast("Mic access denied");
      return;
    }
    stopAllAudio(); // interrupt doctor if still speaking

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);

    // ── Adaptive silence detection ──
    // Phase 1 (first 700ms): CALIBRATE ambient noise floor — don't stop recording.
    // Phase 2 (after calibration): require voice onset (RMS > ambient + margin)
    //   before silence timer is even armed. Stop only after sustained silence
    //   AFTER user has actually spoken. This prevents:
    //   (a) instant cutoff in loud rooms (we know what "ambient" means)
    //   (b) cutoff when user pauses to think before speaking
    const recStart = Date.now();
    const CALIBRATION_MS = 700;
    const SILENCE_MS = 2500;
    const MIN_RECORD_MS = 2000; // never stop in the first 2s no matter what
    let ambientRms = 0;
    let calibrationSamples = [];
    let voiceThreshold = 8; // fallback if calibration fails
    let hasDetectedVoice = false;
    let lastSound = Date.now();

    silenceTimer = setInterval(() => {
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / data.length) * 100;
      const elapsed = Date.now() - recStart;

      // Phase 1: calibrate ambient
      if (elapsed < CALIBRATION_MS) {
        calibrationSamples.push(rms);
        updateMicLevel(rms, false);
        return;
      }

      // End of calibration: compute threshold once
      if (calibrationSamples.length > 0) {
        calibrationSamples.sort((a, b) => a - b);
        // Use median so a single spike doesn't skew it
        ambientRms = calibrationSamples[Math.floor(calibrationSamples.length / 2)];
        // Voice must be at least 2.5× ambient AND above absolute floor of 4
        voiceThreshold = Math.max(ambientRms * 2.5, ambientRms + 3, 4);
        calibrationSamples = [];
      }

      const isVoice = rms > voiceThreshold;
      updateMicLevel(rms, isVoice);

      if (isVoice) {
        hasDetectedVoice = true;
        lastSound = Date.now();
      }

      // Hard minimum recording time
      if (elapsed < MIN_RECORD_MS) return;

      // Only start the silence countdown AFTER the user has spoken at least once.
      // If they never speak (all noise, or they're silent), max timer will catch it.
      if (hasDetectedVoice && (Date.now() - lastSound > SILENCE_MS)) {
        stopRecording();
      }
    }, 100);
    maxTimer = setTimeout(() => stopRecording(), 30000);

    const mimeType =
      MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
      : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => processAudio();
    mediaRecorder.start();
    isRecording = true; state = "recording";
    setMicState("recording", "Tap to stop");
  } else {
    stopRecording();
  }
}
function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  state = "thinking";
  if (silenceTimer) clearInterval(silenceTimer);
  if (maxTimer) clearTimeout(maxTimer);
  silenceTimer = maxTimer = null;
  if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
  try { mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop()); } catch(e){}
  micBtn.style.removeProperty("--mic-glow");
  setMicState("thinking", "One moment…");
}

// ─────────── Process audio + streaming chat ───────────
async function processAudio() {
  const myToken = sessionToken;
  const blob = new Blob(audioChunks, { type: "audio/webm" });
  const form = new FormData();
  form.append("audio", blob, "audio.webm");

  let transcript = "";
  try {
    const sttRes = await fetch("/transcribe", { method: "POST", body: form, credentials: "same-origin" });
    const sttData = await sttRes.json();
    transcript = (sttData.transcript || "").trim();
  } catch (e) {
    showToast("Couldn't process audio");
    setMicState("idle", "Tap to speak"); state = "idle"; return;
  }
  if (myToken !== sessionToken) return;

  if (!transcript) {
    showToast("Didn't catch that — try again");
    setMicState("idle", "Tap to speak"); state = "idle"; return;
  }

  addMsg("user", transcript);
  addThinking();
  state = "streaming";

  await streamChat(transcript, myToken);

  if (myToken === sessionToken) {
    setMicState("idle", "Tap to speak");
    state = "idle";
  }
}

// ─────────── SSE streaming ───────────
async function streamChat(userText, myToken) {
  chatAbortController = new AbortController();
  let doctorMsgEl = null;
  let doctorBubble = null;
  let fullText = "";

  try {
    const res = await fetch("/chat_stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ text: userText }),
      signal: chatAbortController.signal,
    });

    if (!res.ok || !res.body) {
      throw new Error("stream_failed");
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if (myToken !== sessionToken) { try { reader.cancel(); } catch(e){} break; }

      buffer += decoder.decode(value, { stream: true });

      // Parse SSE events — separated by blank lines
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const rawEvent = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        const evt = parseSSE(rawEvent);
        if (!evt) continue;

        if (evt.event === "sentence") {
          // First sentence: remove thinking bubble and create the real message
          if (!doctorMsgEl) {
            const t = $("thinkingMsg"); if (t) t.remove();
            doctorMsgEl = document.createElement("div");
            doctorMsgEl.className = "msg doctor";
            doctorMsgEl.innerHTML = `
              <div class="msg-label">DoctorAI</div>
              <div class="bubble streaming"></div>
              <div class="pose-strip" style="display:none"></div>
            `;
            convo.appendChild(doctorMsgEl);
            doctorBubble = doctorMsgEl.querySelector(".bubble");
            doctorMsgEl._shownPoses = new Set(); // dedupe across sentences in this message
          }
          fullText = fullText ? fullText + " " + evt.data.text : evt.data.text;
          doctorBubble.textContent = fullText;

          // Render any new pose images attached to this sentence
          if (evt.data.poses && evt.data.poses.length) {
            const strip = doctorMsgEl.querySelector(".pose-strip");
            for (const pose of evt.data.poses) {
              if (doctorMsgEl._shownPoses.has(pose.name)) continue;
              doctorMsgEl._shownPoses.add(pose.name);
              const card = document.createElement("div");
              card.className = "pose-card";
              card.innerHTML = `
                <img loading="lazy" alt="${pose.name}" src="${pose.image}"
                     onerror="this.parentElement.style.display='none'"/>
                <div class="pose-name">${pose.name}</div>
              `;
              strip.appendChild(card);
            }
            strip.style.display = "flex";
          }

          convo.scrollTop = convo.scrollHeight;
          if (evt.data.audio) enqueueAudio(evt.data.audio);
          if (evt.data.emergency) addEmergencyBanner();
        } else if (evt.event === "done") {
          if (doctorBubble) doctorBubble.classList.remove("streaming");
        } else if (evt.event === "error") {
          showToast("Doctor is offline — try again");
        }
      }
    }
    if (doctorBubble) doctorBubble.classList.remove("streaming");
  } catch (e) {
    if (e.name !== "AbortError") {
      const t = $("thinkingMsg"); if (t) t.remove();
      showToast("Connection dropped");
    }
  } finally {
    chatAbortController = null;
  }
}

function parseSSE(raw) {
  // One event block — lines like "event: X" and "data: Y"
  let event = "message", data = "";
  for (const line of raw.split("\n")) {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  }
  if (!data) return null;
  try { return { event, data: JSON.parse(data) }; }
  catch (e) { return null; }
}

// ─────────── End call ───────────
function endCall() {
  abortEverything();
  stopTimer();
  fetch("/reset", { method: "POST", credentials: "same-origin" }).catch(()=>{});
  selectedLang = null;
  document.querySelectorAll(".lang-chip").forEach(b => b.classList.remove("active"));
  setStatus("Call ended", "ended");
  setMicState("disabled", "Pick a language to restart");
  presence.style.display = "none";
  convo.innerHTML = `
    <div class="empty">
      <div class="empty-title">Take care.</div>
      <div class="empty-sub">Pick a language below whenever you want to talk again.</div>
    </div>`;
}
</script>
